<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grd Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>grd Demo</h1>
    <p>Thin client provisioning the <code>grd</code> kclib native library. Grid splits are computed locally, in-process, by <code>libgrd.so</code> through the JNI bridge (no subprocess).</p>
  </header>

  <section class="controls">
    <label>Width <input id="w" type="number" value="1920"></label>
    <label>Height <input id="h" type="number" value="1080"></label>
    <label>Direction
      <select id="k">
        <option value="row">row</option>
        <option value="col">col</option>
      </select>
    </label>
    <label>Weights <input id="W" type="text" value="1 2 1"></label>
    <button id="run">Run grd</button>
  </section>

  <pre id="output">Press "Run grd" to split the area locally.</pre>

  <footer>
    <button id="deps">Show installed deps</button>
    <span id="status"></span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
