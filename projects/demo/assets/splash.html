<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: #101418;
      color: #dde3ea;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 0 1.5rem;
      text-align: center;
    }
    h2 { margin: 0 0 0.5rem; font-size: 1.1rem; font-weight: 600; }
    #stage { margin: 0 0 1rem; color: #8b949e; font-size: 0.9rem; }
    .progress-bar {
      width: 100%; max-width: 24rem; height: 0.5rem;
      background: #232b36; border-radius: 4px; overflow: hidden;
    }
    #fill { height: 100%; width: 0%; background: #238636; }
    #bytes { margin: 0.75rem 0 0; color: #8b949e; font-size: 0.8rem; }
    #warn { margin: 1rem 0 0; color: #f0883e; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
  <h2>Loading</h2>
  <p id="stage">Starting...</p>
  <div class="progress-bar"><div id="fill"></div></div>
  <p id="bytes"></p>
  <p id="warn"></p>
  <script src="js/splash.js"></script>
  <script>
    KcSplash.onStatus(function (s) { var e = document.getElementById('stage'); if (e) e.textContent = s; });
    KcSplash.onProgress(function (info) {
      var fill = document.getElementById('fill');
      if (fill) fill.style.width = info.percent + '%';
      var b = document.getElementById('bytes');
      if (b) b.textContent = info.summary;
    });
    KcSplash.onWarning(function (w) {
      var e = document.getElementById('warn');
      if (e) { e.textContent = w; e.style.display = 'block'; }
    });
  </script>
</body>
</html>
